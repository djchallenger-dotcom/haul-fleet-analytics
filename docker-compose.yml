services:
  postgres:
    image: postgres:16
    container_name: haul-fleet-pg
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet       # local demo only
      POSTGRES_DB: haul_fleet
    ports:
      - "55432:5432"
    volumes:
      # Every .sql file in this folder runs automatically, in name order,
      # the first time the container starts with an empty data volume.
      - ./schema/postgres:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: haul-fleet-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "HaulFleet!2026"   # local demo only
    ports:
      - "51433:1433"
    volumes:
      - mssqldata:/var/opt/mssql

volumes:
  pgdata:
  mssqldata:

